name: Deploy Snapshot

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Deploy snapshot
    steps:
      - uses: actions/checkout@v5
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version:  17
          distribution: 'temurin'
          cache: 'maven'
          server-id: snapshot-repository
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - uses: JackPGreen/maven-release-tooling/deploy@init
        env:
          MAVEN_ARGS: --activate-profiles release-snapshot
          MAVEN_USERNAME: ${{ secrets.SONATYPE_OSS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_OSS_PASSWORD }}
